# 所有环境共用的配置。环境差异放在 application-dev.yml / application-mysql.yml。
spring:
  application:
    name: learnlab-server
  profiles:
    # 没有显式指定 profile 时用 dev（H2 文件库）。测试里激活 test 后，这里不会再生效。
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      # 表结构只由 Flyway 的 SQL 负责，Hibernate 不自动改表。
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

learnlab:
  jwt:
    # 本地学习用的默认密钥。至少 32 字节。对外暴露服务前用环境变量 JWT_SECRET 换掉。
    secret: ${JWT_SECRET:learnlab-dev-secret-key-change-me-32b}
    expiration-minutes: 720
  upload-dir: uploads
  seed:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

info:
  app:
    name: LearnLab
    description: Vue + Spring Boot study workbench

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.learnlab: info
