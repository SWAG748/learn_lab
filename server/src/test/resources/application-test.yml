spring:
  datasource:
    url: jdbc:h2:mem:learnlab;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false

learnlab:
  seed:
    enabled: false

logging:
  level:
    org.hibernate.SQL: warn
    com.learnlab: info
